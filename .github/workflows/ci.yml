name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci installs better-sqlite3 for the system Node ABI (not Electron's).
      # Unit tests never boot Electron, so the system-Node binary is correct here.
      # Do NOT run electron-rebuild in CI — that would target the wrong ABI for tests.
      - run: npm ci

      - run: node --test tests/unit/**/*.test.js tests/unit/*.test.js
