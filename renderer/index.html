<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>AI Medical Scribe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- Header row (status + gear icon) -->
    <div id="header-row">
      <div id="status-row">
        <div id="indicator"></div>
        <span id="status-label">Loading...</span>
      </div>
      <div id="header-icons">
        <button id="btn-settings" class="icon-btn" title="Settings">&#9881;</button>
        <button id="btn-window-close" class="icon-btn" title="Close popup">&#10005;</button>
      </div>
    </div>

    <!-- Settings view (hidden by default) -->
    <div id="settings-view" class="hidden">
      <div class="settings-header">
        <span>Settings</span>
        <button id="btn-settings-close" class="icon-btn" title="Back">&#10005;</button>
      </div>

      <div class="settings-group">
        <label class="setting-row">
          <input type="checkbox" id="chk-auto-record" />
          <span>Auto-start recording after save</span>
        </label>
        <div class="setting-hint">Next recording begins immediately when you save a case</div>
      </div>

      <div class="settings-group advanced-settings-group">
        <button id="btn-advanced-toggle" class="advanced-toggle">
          <span>Advanced Settings</span>
          <span class="toggle-arrow">&#9654;</span>
        </button>
        <div id="advanced-settings-content" class="hidden">
          <div class="advanced-settings-inner">
            <label class="setting-label">Audio Output Device</label>
            <select id="device-select">
              <option value="">Loading devices...</option>
            </select>
            <div class="setting-hint">Override automatic loopback device detection</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Timer (visible only while RECORDING) -->
    <div id="timer" class="hidden">00:00</div>

    <!-- Config warnings (missing ElevenLabs key / doctor name) -->
    <div id="config-warnings">
      <div id="warn-elevenlabs" class="config-warn hidden">
        <div class="warn-header"><span class="warn-icon">&#9888;</span> ElevenLabs API key missing</div>
        <div class="warn-input-row">
          <input id="elevenlabs-input" type="text" placeholder="sk_..." autocomplete="off" spellcheck="false" />
          <button id="btn-save-elevenlabs" class="small">Save</button>
        </div>
      </div>
      <div id="warn-doctor" class="config-warn hidden">
        <div class="warn-header"><span class="warn-icon">&#9888;</span> Doctor name not set</div>
        <div class="warn-input-row">
          <input id="doctor-input" type="text" placeholder="e.g. Dr. Smith" autocomplete="off" spellcheck="false" />
          <button id="btn-save-doctor" class="small">Save</button>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div id="action-buttons"></div>

    <!-- Upload patient name form (shown after file picked, no countdown) -->
    <div id="upload-form" class="hidden">
      <button id="btn-upload-close" class="upload-close-btn" title="Cancel">&#10005;</button>
      <input id="upload-patient-input" type="text" placeholder="Patient name (optional)" autocomplete="off" spellcheck="false" />
      <div id="upload-form-buttons">
        <button id="btn-upload-save-name">Process</button>
        <button id="btn-upload-skip-name" class="secondary">Skip</button>
      </div>
    </div>

    <!-- Patient name form (shown after Stop) -->
    <div id="patient-form" class="hidden">
      <input id="patient-input" type="text" placeholder="Patient name (optional)" autocomplete="off" spellcheck="false" />
      <div id="form-buttons">
        <button id="btn-save-name">Save</button>
        <button id="btn-skip-name" class="secondary">Skip</button>
      </div>
      <div id="form-countdown"></div>
    </div>

    <!-- Setup warning (BlackHole / ffmpeg) -->
    <div id="setup-warning" class="hidden"></div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
