<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinical Documentation Review — Amy Berger</title>
<style>
  /* =========================================================================
     EDITORIAL REPORT — a typeset clinical document, print/PDF-export quality.
     Restrained, authoritative, ink-on-paper. Serif display, generous margins.
     All styling inline; no external requests; CSP-safe; system fonts only.
     ========================================================================= */

  :root{
    --ink:        #1a1714;   /* near-black warm ink            */
    --ink-soft:   #4a443d;   /* secondary body ink             */
    --ink-faint:  #7a7167;   /* captions, metadata             */
    --paper:      #f4f1ea;   /* warm paper for the desk        */
    --sheet:      #fffdf8;   /* the sheet of paper             */
    --rule:       #ddd5c7;   /* hairline rules                 */
    --rule-dk:    #b8ad9a;   /* heavier rules                  */
    --accent:     #6b4e2e;   /* sepia / editorial brown        */
    --accent-ink: #4a3618;

    /* severity ink-marks — restrained, but legible */
    --sev-critical: #8f2c2c;
    --sev-warning:  #9a6b1f;
    --sev-suggestion:#3a6178;
    --sev-opportunity:#4a6b4a;
    --sev-critical-bg: #f6eae8;
    --sev-warning-bg:  #f6f0e2;
    --sev-suggestion-bg:#e9f0f4;
    --sev-opportunity-bg:#e9f1e9;

    --ok:   #3d6b46;
    --weak: #8f2c2c;
    --hold: #9a6b1f;

    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:16px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* ---- The sheet ---- */
  .sheet{
    max-width:48rem;
    margin:2.4rem auto 4rem;
    background:var(--sheet);
    border:1px solid var(--rule);
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 18px 48px -28px rgba(40,30,15,.45);
    padding:3.4rem 3.6rem 3.2rem;
    position:relative;
  }

  /* ---- Interactive chrome (toolbar) — hidden on print ---- */
  .toolbar{
    position:sticky; top:0; z-index:20;
    display:flex; gap:.6rem; align-items:center; justify-content:flex-end;
    flex-wrap:wrap;
    padding:.6rem max(1rem, calc((100vw - 48rem)/2 - 0rem));
    background:linear-gradient(to bottom, rgba(244,241,234,.97), rgba(244,241,234,.86));
    border-bottom:1px solid var(--rule);
    backdrop-filter:saturate(120%) blur(2px);
    font-family:var(--sans);
  }
  .toolbar .tb-title{
    margin-right:auto; font-family:var(--serif); font-style:italic;
    color:var(--ink-faint); font-size:.92rem; letter-spacing:.01em;
  }
  .btn{
    font-family:var(--sans); font-size:.8rem; font-weight:600;
    color:var(--ink-soft); background:var(--sheet);
    border:1px solid var(--rule-dk); border-radius:3px;
    padding:.42rem .8rem; cursor:pointer; letter-spacing:.02em;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .btn:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn[aria-pressed="true"]{ background:var(--accent-ink); color:#fff; border-color:var(--accent-ink); }

  /* ============================ LETTERHEAD ============================ */
  .letterhead{
    text-align:center;
    padding-bottom:1.4rem;
    border-bottom:2px solid var(--ink);
    margin-bottom:.2rem;
    position:relative;
  }
  .letterhead .mark{
    font-family:var(--sans);
    font-size:.66rem; font-weight:700; letter-spacing:.34em;
    text-transform:uppercase; color:var(--accent);
    margin-bottom:.7rem;
  }
  .letterhead h1{
    font-family:var(--serif);
    font-weight:400; font-size:2.05rem; line-height:1.15;
    margin:0 0 .35rem; letter-spacing:.005em;
  }
  .letterhead .subtitle{
    font-style:italic; color:var(--ink-faint); font-size:1.02rem;
    margin:0;
  }
  .letterhead .versionline{
    font-family:var(--sans); font-size:.66rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint);
    margin-top:1rem;
  }

  /* ---- Case header table (letterhead-style metadata) ---- */
  .casehead{
    margin:1.6rem 0 0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    padding:1.1rem 0;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:.65rem 2.4rem;
  }
  .ch-item{ display:flex; flex-direction:column; gap:.1rem; }
  .ch-label{
    font-family:var(--sans); font-size:.62rem; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
  }
  .ch-value{ font-size:1rem; color:var(--ink); }
  .ch-value.mono{ font-family:var(--mono); font-size:.86rem; }
  .ch-full{ grid-column:1 / -1; }
  .ch-value .casedir{
    font-family:var(--mono); font-size:.72rem; color:var(--ink-faint);
    word-break:break-all; line-height:1.4;
  }

  /* ============================ SECTIONS ============================ */
  .section{ margin-top:2.8rem; }
  .section-head{
    display:flex; align-items:baseline; gap:.8rem;
    border-bottom:1px solid var(--rule-dk);
    padding-bottom:.45rem; margin-bottom:1.3rem;
  }
  .section-no{
    font-family:var(--serif); font-style:italic;
    font-size:1.5rem; color:var(--accent); line-height:1;
    flex:0 0 auto;
  }
  .section-title{
    font-family:var(--serif); font-weight:400;
    font-size:1.42rem; margin:0; letter-spacing:.01em;
    flex:1 1 auto;
  }
  .section-kicker{
    font-family:var(--sans); font-size:.62rem; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
    flex:0 0 auto; align-self:center;
  }
  .lede{
    font-size:1.06rem; color:var(--ink-soft);
    margin:0 0 1.4rem; font-style:italic;
    border-left:3px solid var(--rule-dk); padding-left:1rem;
  }

  /* ============================ VERDICT / SCORES ============================ */
  .verdict{
    display:grid; grid-template-columns:1.1fr 1fr; gap:1.6rem;
    align-items:start;
  }
  .scorebox{
    border:1px solid var(--rule-dk);
    padding:1.1rem 1.2rem;
    background:linear-gradient(180deg, var(--sheet), #faf6ee);
  }
  .scorebox .qlabel{
    font-family:var(--sans); font-size:.62rem; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
  }
  .scorebox .qmain{
    display:flex; align-items:baseline; gap:.5rem; margin:.2rem 0 .15rem;
  }
  .qnum{ font-family:var(--serif); font-size:3.1rem; line-height:1; font-weight:400; }
  .qdenom{ font-family:var(--serif); font-size:1.1rem; color:var(--ink-faint); }
  .qverd{
    font-family:var(--sans); font-size:.74rem; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .meter{ height:7px; background:#e7e0d2; border-radius:4px; overflow:hidden; margin-top:.7rem; }
  .meter > span{ display:block; height:100%; border-radius:4px; }

  .subscores{ display:flex; flex-direction:column; gap:.85rem; }
  .subscore .ss-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .ss-name{ font-family:var(--sans); font-size:.78rem; font-weight:600; color:var(--ink-soft); }
  .ss-val{ font-family:var(--serif); font-size:.95rem; }
  .ss-meter{ height:5px; background:#e7e0d2; border-radius:3px; overflow:hidden; margin-top:.25rem; }
  .ss-meter > span{ display:block; height:100%; background:var(--accent); border-radius:3px; }

  /* status chips row */
  .statusgrid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
    gap:0; border:1px solid var(--rule); margin-top:1.6rem;
  }
  .statuscell{
    padding:.85rem 1rem; border-right:1px solid var(--rule);
    border-top:3px solid var(--rule-dk);
  }
  .statuscell:last-child{ border-right:none; }
  .sc-label{
    font-family:var(--sans); font-size:.58rem; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:.3rem;
  }
  .sc-value{ font-family:var(--sans); font-size:.92rem; font-weight:700; letter-spacing:.01em; }
  .statuscell.tone-ok{ border-top-color:var(--ok); }
  .statuscell.tone-ok .sc-value{ color:var(--ok); }
  .statuscell.tone-weak{ border-top-color:var(--weak); }
  .statuscell.tone-weak .sc-value{ color:var(--weak); }
  .statuscell.tone-hold{ border-top-color:var(--hold); }
  .statuscell.tone-hold .sc-value{ color:var(--hold); }
  .statuscell.tone-neutral .sc-value{ color:var(--ink); }

  /* flag tally */
  .tally{
    display:flex; gap:1.4rem; flex-wrap:wrap;
    margin-top:1.5rem; padding-top:1.1rem; border-top:1px solid var(--rule);
    align-items:flex-end;
  }
  .tally-head{
    font-family:var(--sans); font-size:.62rem; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
    width:100%;
  }
  .tally-item{ display:flex; align-items:baseline; gap:.45rem; }
  .tally-n{ font-family:var(--serif); font-size:1.7rem; line-height:1; }
  .tally-l{ font-family:var(--sans); font-size:.72rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); }
  .tally-item.t-critical .tally-n{ color:var(--sev-critical); }
  .tally-item.t-warning .tally-n{ color:var(--sev-warning); }
  .tally-item.t-suggestion .tally-n{ color:var(--sev-suggestion); }
  .tally-item.t-opportunity .tally-n{ color:var(--sev-opportunity); }

  /* ============================ FINDINGS ============================ */
  .finding{
    margin:0 0 1.7rem;
    padding:1.25rem 1.4rem 1.35rem;
    border:1px solid var(--rule);
    border-left:4px solid var(--rule-dk);
    background:var(--sheet);
    page-break-inside:avoid;
    break-inside:avoid;
  }
  .finding.sev-critical{ border-left-color:var(--sev-critical); }
  .finding.sev-warning{ border-left-color:var(--sev-warning); }
  .finding.sev-suggestion{ border-left-color:var(--sev-suggestion); }
  .finding.sev-opportunity{ border-left-color:var(--sev-opportunity); }

  .f-head{ display:flex; gap:.85rem; align-items:flex-start; }
  .f-num{
    font-family:var(--serif); font-style:italic; color:var(--accent);
    font-size:1.25rem; line-height:1.2; flex:0 0 auto; min-width:1.4rem;
  }
  .f-headtext{ flex:1 1 auto; min-width:0; }
  .f-tags{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:.35rem; }
  .sev-pill{
    font-family:var(--sans); font-size:.58rem; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase;
    padding:.2rem .5rem; border-radius:2px; line-height:1;
    border:1px solid currentColor;
  }
  .sev-pill.sev-critical{ color:var(--sev-critical); background:var(--sev-critical-bg); }
  .sev-pill.sev-warning{ color:var(--sev-warning); background:var(--sev-warning-bg); }
  .sev-pill.sev-suggestion{ color:var(--sev-suggestion); background:var(--sev-suggestion-bg); }
  .sev-pill.sev-opportunity{ color:var(--sev-opportunity); background:var(--sev-opportunity-bg); }
  .f-cat{
    font-family:var(--sans); font-size:.64rem; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);
  }
  .f-id{
    font-family:var(--mono); font-size:.66rem; color:var(--ink-faint);
    margin-left:auto;
  }
  .f-title{
    font-family:var(--serif); font-weight:600; font-size:1.18rem;
    margin:.1rem 0 .5rem; line-height:1.25; letter-spacing:.005em;
  }
  .f-body{ font-size:.98rem; color:var(--ink-soft); margin:0 0 .9rem; }

  .f-action{
    background:#f3ede1; border:1px solid var(--rule);
    padding:.7rem .9rem; margin:0 0 1rem;
    font-size:.93rem;
  }
  .f-action .lbl{
    font-family:var(--sans); font-size:.6rem; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
    display:block; margin-bottom:.2rem;
  }

  /* evidence as indented blockquotes / sidenotes */
  .evid-group{ margin:.8rem 0; }
  .evid-label{
    font-family:var(--sans); font-size:.6rem; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:.35rem; display:flex; align-items:center; gap:.4rem;
  }
  .evid-label .dot{ width:.5rem; height:.5rem; border-radius:50%; flex:0 0 auto; }
  .evid-found .dot{ background:var(--ok); }
  .evid-missing .dot{ background:var(--sev-critical); }
  blockquote.evid{
    margin:0 0 .45rem; padding:.35rem 0 .35rem .95rem;
    border-left:2px solid var(--rule-dk);
    font-style:italic; font-size:.9rem; color:var(--ink-soft);
    line-height:1.5;
  }
  blockquote.evid.missing{ border-left-color:var(--sev-critical); color:var(--ink-soft); font-style:normal; }
  blockquote.evid.missing::before{ content:"needs: "; font-family:var(--sans); font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--sev-critical); font-style:normal; }

  /* meta row inside a finding: guideline, confidence, codes, reimb */
  .f-meta{
    margin-top:1rem; padding-top:.85rem; border-top:1px dotted var(--rule-dk);
    display:grid; grid-template-columns:1fr; gap:.7rem; font-size:.86rem;
  }
  .fm-row{ display:flex; gap:.6rem; align-items:baseline; }
  .fm-key{
    font-family:var(--sans); font-size:.6rem; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint);
    flex:0 0 8.5rem;
  }
  .fm-val{ color:var(--ink-soft); flex:1 1 auto; min-width:0; }
  .fm-val.ref{ font-style:italic; }

  .conf-wrap{ display:flex; align-items:center; gap:.6rem; flex:1 1 auto; }
  .conf-bar{ flex:1 1 auto; max-width:11rem; height:6px; background:#e7e0d2; border-radius:3px; overflow:hidden; }
  .conf-bar > span{ display:block; height:100%; background:var(--accent); border-radius:3px; }
  .conf-num{ font-family:var(--mono); font-size:.82rem; color:var(--ink); }

  .reimb{
    background:var(--sev-warning-bg); border:1px solid #e6d6ad;
    padding:.6rem .8rem; font-size:.88rem; color:var(--accent-ink);
    border-radius:2px;
  }
  .reimb .lbl{
    font-family:var(--sans); font-size:.58rem; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase; color:var(--sev-warning);
    display:block; margin-bottom:.2rem;
  }

  /* code chips */
  .codechips{ display:flex; flex-wrap:wrap; gap:.45rem; }
  .codechip{
    font-family:var(--mono); font-size:.78rem;
    border:1px solid var(--rule-dk); border-radius:3px;
    padding:.18rem .5rem; background:#faf6ee; color:var(--ink);
    display:inline-flex; gap:.4rem; align-items:baseline;
  }
  .codechip .desc{ font-family:var(--serif); font-size:.78rem; color:var(--ink-faint); font-style:italic; }
  .codechip.current{ background:var(--sev-critical-bg); border-color:#dab; }
  .codechip.suggested{ background:var(--sev-suggestion-bg); border-color:#a9c2cf; }

  /* provider query (sidenote style) */
  .query{
    margin-top:1rem; background:#eef3f6;
    border:1px solid #c7d8e0; border-left:4px solid var(--sev-suggestion);
    padding:.85rem 1rem; border-radius:2px;
  }
  .query .q-head{
    font-family:var(--sans); font-size:.6rem; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase; color:var(--sev-suggestion);
    margin-bottom:.4rem; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
  }
  .query .q-type{
    font-size:.55rem; background:var(--sev-suggestion); color:#fff;
    padding:.1rem .4rem; border-radius:2px; letter-spacing:.08em;
  }
  .query .q-question{ font-size:.94rem; color:var(--ink); margin:0 0 .55rem; font-style:italic; }
  .query .q-sub{
    font-family:var(--sans); font-size:.58rem; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-faint); margin:.5rem 0 .25rem;
  }
  .query ul{ margin:.2rem 0 0; padding-left:1.15rem; font-size:.88rem; color:var(--ink-soft); }
  .query ul li{ margin-bottom:.18rem; }
  .query ol.opts{ margin:.2rem 0 0; padding-left:1.3rem; font-size:.9rem; }
  .query ol.opts li{ margin-bottom:.22rem; }

  /* ============================ E/M MDM SECTION ============================ */
  .em-headline{
    font-size:1.05rem; color:var(--ink); background:#f3ede1;
    border:1px solid var(--rule-dk); padding:1rem 1.2rem; margin:0 0 1.5rem;
    line-height:1.55;
  }
  .em-verdict{
    display:flex; gap:1.4rem; flex-wrap:wrap; align-items:stretch;
    margin-bottom:1.6rem;
  }
  .em-level{
    border:1px solid var(--rule-dk); padding:1rem 1.3rem; text-align:center;
    flex:1 1 9rem; background:linear-gradient(180deg,var(--sheet),#faf6ee);
  }
  .em-level .lbl{
    font-family:var(--sans); font-size:.58rem; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint);
  }
  .em-level .code{ font-family:var(--serif); font-size:2.5rem; line-height:1.1; }
  .em-level .sub{ font-family:var(--sans); font-size:.72rem; color:var(--ink-soft); }
  .em-level.supported .code{ color:var(--ok); }
  .em-level.billed .code{ color:var(--sev-warning); text-decoration:line-through; text-decoration-color:#c9a04f; text-decoration-thickness:2px; }
  .em-arrow{ align-self:center; font-family:var(--serif); font-size:1.6rem; color:var(--ink-faint); flex:0 0 auto; }

  .downcode-note{
    font-size:.95rem; color:var(--ink-soft); font-style:italic;
    border-left:3px solid var(--sev-warning); padding-left:1rem; margin:0 0 1.6rem;
  }

  .mdm-eyebrow{
    font-family:var(--sans); font-size:.62rem; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 .7rem;
  }
  .mdm-table{ border:1px solid var(--rule-dk); margin-bottom:1.5rem; }
  .mdm-row{ border-bottom:1px solid var(--rule); padding:1rem 1.2rem; }
  .mdm-row:last-child{ border-bottom:none; }
  .mdm-row .mdm-top{ display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-bottom:.5rem; }
  .mdm-elname{ font-family:var(--serif); font-size:1.08rem; font-weight:600; }
  .mdm-elscore{
    font-family:var(--sans); font-size:.68rem; font-weight:800;
    letter-spacing:.1em; text-transform:uppercase;
    padding:.22rem .55rem; border-radius:2px; border:1px solid currentColor; white-space:nowrap;
  }
  .sc-straightforward{ color:var(--ok); background:var(--sev-opportunity-bg); }
  .sc-low{ color:var(--sev-suggestion); background:var(--sev-suggestion-bg); }
  .sc-moderate{ color:var(--sev-warning); background:var(--sev-warning-bg); }
  .sc-high{ color:var(--sev-critical); background:var(--sev-critical-bg); }
  .mdm-drivers{ margin:.3rem 0 0; padding-left:1.1rem; font-size:.92rem; color:var(--ink-soft); }
  .mdm-drivers li{ margin-bottom:.4rem; }
  .mdm-gap{
    margin-top:.7rem; background:#f6f0e2; border:1px solid #e6d6ad;
    padding:.6rem .8rem; font-size:.86rem; color:var(--accent-ink); border-radius:2px;
  }
  .mdm-gap .lbl{
    font-family:var(--sans); font-size:.56rem; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--sev-warning); display:block; margin-bottom:.2rem;
  }

  .em-narrative{ margin-bottom:1.3rem; }
  .em-narrative h4{
    font-family:var(--sans); font-size:.62rem; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 .35rem;
  }
  .em-narrative p{ margin:0 0 1rem; font-size:.96rem; color:var(--ink-soft); }
  .upgrade-box{
    border:1px dashed var(--rule-dk); padding:.9rem 1.1rem; background:#faf6ee;
    font-size:.94rem; color:var(--ink-soft); line-height:1.6;
  }
  .em-time{
    font-family:var(--sans); font-size:.85rem; color:var(--ink-faint);
    margin-top:1rem; padding-top:.8rem; border-top:1px dotted var(--rule-dk);
  }
  .em-time strong{ color:var(--ink-soft); }

  /* ============================ CODE VALIDATION ============================ */
  .cv-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:1rem; }
  .cv-card{ border:1px solid var(--rule); padding:.9rem 1rem; }
  .cv-card h4{
    font-family:var(--sans); font-size:.6rem; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 .55rem;
    display:flex; align-items:center; gap:.4rem;
  }

  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

    .section-head{ page-break-after:avoid; }
    .letterhead{ page-break-after:avoid; }
    a{ color:#000; text-decoration:none; }

    .sev-pill, .statuscell, .em-level, .ps-wrap, .approval, .mdm-elscore, .codechip{

    }

    const s = cdi.summary || {};
    const m = PA_DATA.meta || {};
    const approval = s.clinician_approval_required === true;
    const approvalHtml = (s.clinician_approval_required === true || s.clinician_approval_required === false)
      ? `<div class="approval ${approval?"":"cleared"}">${approval
          ? "Clinician approval required &mdash; this review is on hold pending attending physician sign-off before claim submission."
          : "No clinician approval flagged for this review."}</div>`
      : "";
    return `
      <footer class="colophon">
        <div class="row">
          <span><strong>Report generated:</strong> ${fmtDateTime(m.generated_at)}</span>
          <span><strong>Patient:</strong> ${esc(m.patient||"—")}</span>
          <span><strong>Physician:</strong> ${esc(m.doctor||"—")}</span>
        </div>
        <div class="row">
          <span><strong>Engines:</strong> CDI Review &middot; E/M MDM Scorer &middot; Patient Summary</span>
          <span><strong>Mode:</strong> ${esc(titleCase(m.mode)||"—")}</span>
        </div>
        ${approvalHtml}
        <div class="row" style="margin-top:.8rem;font-style:italic;">
          Confidential &mdash; generated for clinical documentation integrity review. Not a substitute for independent clinician judgment.
        </div>
      </footer>`;
  }

  /* ====================== ASSEMBLE ====================== */
  function render(){
    const root = document.getElementById("report");
    if(!root) return;
    const parts = [
      renderHead(),
      renderVerdict(),
      renderFindings(),
      renderQueries(),
      renderEM(),
      renderCodeValidation(),
      renderPatientSummary(),
      renderColophon()
    ];
    root.innerHTML = parts.join("");
  }

  /* ====================== INTERACTIVE CHROME ====================== */
  function wireToolbar(){
    const printBtn = document.getElementById("btn-print");
    if(printBtn) printBtn.addEventListener("click", () => window.print());

    const evBtn = document.getElementById("btn-evidence");
    if(evBtn){
      let shown = true;
      const apply = () => {
        document.querySelectorAll(".evidence-zone").forEach(z => {
          z.style.display = shown ? "" : "none";
        });
        evBtn.setAttribute("aria-pressed", String(shown));
        evBtn.textContent = shown ? "Evidence shown" : "Evidence hidden";
      };
      evBtn.addEventListener("click", () => { shown = !shown; apply(); });
    }
  }

  /* boot — guard so a single bad value can't blank the page */
  try{
    render();
    wireToolbar();
  }catch(err){
    const root = document.getElementById("report");
    if(root && !root.innerHTML.trim()){
      root.innerHTML = '<p class="empty-note" style="padding:2rem">This report could not be rendered from the supplied data.</p>';
    }
    /* surface to console for the renderer integration, but never throw to the user */
    if(window && window.console) console.warn("Render warning:", err);
  }
})();
</script>
</body>
</html>
