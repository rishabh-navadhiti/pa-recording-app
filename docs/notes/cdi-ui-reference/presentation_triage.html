        evidHtml = `<div class="evid">
          ${evFound?`<div class="evid-col"><div class="k">Evidence found</div><ul class="ev found">${evFound}</ul></div>`:""}
          ${evMiss?`<div class="evid-col"><div class="k">Evidence missing</div><ul class="ev missing">${evMiss}</ul></div>`:""}
        </div>`;
      }

      // provider query
      let queryHtml = "";
      const q = f.provider_query;
      if (q && has(q.question)){
        const ind = (q.clinical_indicators||[]).map(i=>`<li>${esc(i)}</li>`).join("");
        const opts = (q.options||[]).map(o=>`<li>${esc(o)}</li>`).join("");
        queryHtml = `<div class="query">
          <div class="qhead">
            <span class="qtype">${esc(titleCase(q.query_type||"query"))}</span>
            <span class="qlabel">Provider Query</span>
          </div>
          <div class="qq">${esc(q.question)}</div>
          ${ind?`<div class="qsub">Clinical indicators</div><ul>${ind}</ul>`:""}
          ${opts?`<div class="qsub">Options</div><ol>${opts}</ol>`:""}
        </div>`;
      }

      const reimb = has(f.reimbursement_impact)
        ? `<div class="kv"><div class="k">Reimbursement impact</div><div class="reimb">${esc(f.reimbursement_impact)}</div></div>` : "";

      const ref = has(f.guideline_reference)
        ? `<div class="kv"><div class="k">Guideline reference</div><div class="ref">${esc(f.guideline_reference)}</div></div>` : "";

      const card = el(`<details class="flag" style="border-left-color:${s.c}" ${openFirst?"open":""}>
        <summary class="flag-head">
          <span class="chev">▶</span>
          <div class="flag-meta">
            <span class="pill sev-pill" style="color:${s.c};background:${s.bg}">${esc(s.label)}</span>
            ${has(f.category)?`<span class="tag">${esc(f.category)}</span>`:""}
            ${has(f.confidence)?`<span class="conf-meta">conf ${esc(f.confidence)}%</span>`:""}
            ${has(f.id)?`<span class="conf-meta faint">${esc(f.id)}</span>`:""}
          </div>
          <div class="flag-action">${esc(f.action || f.title || "")}</div>
          ${has(f.title)?`<div class="flag-title">${esc(f.title)}</div>`:""}
        </summary>
        <div class="flag-body">
          ${has(f.body)?`<p class="body-text">${esc(f.body)}</p>`:""}
          ${codesHtml}
          ${reimb}
          ${evidHtml}
          ${queryHtml}
          ${ref}
        </div>
      </details>`);
      list.appendChild(card);
    });

    root.appendChild(sec);
  })();

  /* ---------- E/M MDM STRIP ---------- */
  (function emStrip(){
    if (!has(em.predicted_em_level) && !has(em.mdm_elements)) return;

    // The CDI flag-004 + EM headline establish a billed 99215 vs predicted 99214 story.
    const predicted = em.predicted_em_level || "—";
    // detect billed level from upgrade_path / headline (verbatim text mentions 99215)
    let billed = null;
    const txt = (em.upgrade_path||"") + " " + (em.headline||"");
    const m = txt.match(/(99215|99213|99212|99211)/);
    if (m) billed = m[1];
    if (billed === predicted) billed = null;

    const dc = em.downcode_risk;
    const dcColor = dc==="high"?"var(--crit)":dc==="moderate"?"var(--warn)":dc==="low"?"var(--ok)":"var(--ink-faint)";
    const dcBg = dc==="high"?"var(--crit-bg)":dc==="moderate"?"var(--warn-bg)":dc==="low"?"var(--ok-bg)":"var(--panel-2)";

    const order = [
      ["problems_addressed","Problems"],
      ["data_reviewed","Data"],
      ["risk","Risk"]
    ];
    const mdm = em.mdm_elements || {};
    const cells = order.map(([key,name])=>{
      const e = mdm[key]; if (!e) return "";
      const sc = (e.score||"").toLowerCase();
      const drivers = (e.drivers||[]).map(d=>`<li>${esc(d)}</li>`).join("");
      const gap = has(e.documentation_gap)
        ? `<div class="mdm-gap"><b>Gap →</b> ${esc(e.documentation_gap)}</div>` : "";
      return `<div class="mdm-cell">
        <div class="mh">
          <span class="mname">${esc(name)}</span>
          <span class="mscore ms-${esc(sc)||'low'}">${esc(cap(e.score)||"—")}</span>
        </div>
        ${drivers?`<ul>${drivers}</ul>`:""}
        ${gap}
      </div>`;
    }).join("");

    const ta = em.time_alternative || {};
    const taHtml = (has(ta.documented_minutes) || has(ta.level_if_time))
      ? `<div class="time-alt">
           <span class="ta">Documented time: <b>${has(ta.documented_minutes)?esc(ta.documented_minutes)+" min":"—"}</b></span>
           <span class="ta">Level if time-based: <b>${has(ta.level_if_time)?esc(ta.level_if_time):"—"}</b></span>
         </div>`
      : `<div class="time-alt"><span class="ta faint">Time-based alternative unavailable — no total practitioner time documented.</span></div>`;

    const sec = el(`<section class="sec" aria-label="E/M MDM">
      <div class="sec-title">
        <h2>E/M · MDM Scoring</h2>
        <span class="hint">${has(em.visit_type)?esc(cap(em.visit_type))+" patient":""}${em.visit_type_assumed?" (assumed)":""}${has(em.predicted_complexity)?" · "+esc(cap(em.predicted_complexity))+" MDM":""}</span>
        <span class="sec-rule"></span>
      </div>
      <div class="em">
        <div class="em-top">
          <div class="em-levels">
            ${billed?`<div class="levelbox billed"><div class="lv">${esc(billed)}</div><div class="cap">Billed (placeholder)</div></div>
                      <span class="em-arrow">→</span>`:""}
            <div class="levelbox supported"><div class="lv">${esc(predicted)}</div><div class="cap">Supported by note</div></div>
          </div>
          ${has(dc)?`<div class="downcode">
            <span class="dlabel">Downcode risk</span>
            <span class="pill" style="color:${dcColor};background:${dcBg};font-size:13px;text-transform:uppercase">${esc(dc)}</span>
          </div>`:""}
        </div>

        ${has(em.headline)?`<div class="em-headline">${esc(em.headline)}</div>`:""}

        ${cells?`<div class="mdm-grid">${cells}</div>`:""}

        <div class="em-foot">
          ${has(em.final_level_basis)?`<div class="blk"><div class="k">Final level basis</div><p>${esc(em.final_level_basis)}</p></div>`:""}
          ${has(em.upgrade_path)?`<div class="blk upgrade"><div class="k">Upgrade path to 99215</div><p>${esc(em.upgrade_path)}</p></div>`:""}
          ${taHtml}
        </div>
      </div>
    </section>`);
    root.appendChild(sec);
  })();

  /* ---------- PATIENT SUMMARY (collapsed) ---------- */
  (function patientSummary(){
    if (!has(ps.headline) && !has(ps.sections)) return;
    const secs = ps.sections || {};
    const labels = {
      whats_going_on:"What's going on",
      your_plan:"Your plan",
      medications:"Medications",
      follow_up:"Follow-up",
      when_to_seek_help:"When to seek help"
    };
    const order = ["whats_going_on","your_plan","medications","follow_up","when_to_seek_help"];
    const body = order.filter(k=>has(secs[k])).map(k=>
      `<div class="ps-sec"><div class="k">${esc(labels[k]||titleCase(k))}</div><p>${esc(secs[k])}</p></div>`
    ).join("");

    const panel = el(`<section class="sec" aria-label="Patient summary">
      <details class="panel">
        <summary>
          <span><span class="pt">Patient Summary</span>
            ${has(ps.reading_level)?`<span class="psub"> · ${esc(ps.reading_level)} reading level</span>`:""}</span>
          <span class="chev">▶</span>
        </summary>
        <div class="panel-body">
          ${has(ps.headline)?`<div class="ps-headline">${esc(ps.headline)}</div>`:""}
          ${body}
        </div>
      </details>
    </section>`);
    root.appendChild(panel);
  })();

  /* ---------- CODE VALIDATION (collapsed) ---------- */
  (function codeValidation(){
    const cv = cdi.code_validation;
    if (!cv) return;
    const inNote = cv.codes_in_note || [];
    const supported = new Set(cv.supported || []);
    const flagged = new Set(cv.flagged || []);

    const rows = inNote.map(code=>{
      let stat = '<span class="stat sup">Supported</span>';
      if (flagged.has(code)) stat = '<span class="stat flg">Flagged</span>';
      else if (!supported.has(code)) stat = '<span class="stat mis">Unverified</span>';
      return `<tr><td class="code">${esc(code)}</td><td>${stat}</td></tr>`;
    }).join("");

    const missing = (cv.missing_codes||[]).map(m=>
      `<div class="missrow">
        <span class="stat mis">+ ${esc(m.suggested_code)}</span>
        <span>${esc(m.documented_dx)}</span>
        ${has(m.linked_flag_id)?`<span class="tag">${esc(m.linked_flag_id)}</span>`:""}
      </div>`).join("");

    const counts = `${inNote.length} in note · ${(cv.supported||[]).length} supported · ${(cv.flagged||[]).length} flagged · ${(cv.missing_codes||[]).length} missing`;

    const panel = el(`<section class="sec" aria-label="Code validation">
      <details class="panel">
        <summary>
          <span><span class="pt">Code Validation</span><span class="psub"> · ${esc(counts)}</span></span>
          <span class="chev">▶</span>
        </summary>
        <div class="panel-body">
          ${rows?`<div class="table-scroll"><table class="cv">
            <thead><tr><th>Code in note</th><th>Status</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`:`<p class="empty-note">No codes listed in note.</p>`}
          ${missing?`<div class="cv-missing"><div class="k">Missing codes</div>${missing}</div>`
                   :`<div class="cv-missing"><div class="k">Missing codes</div><p class="empty-note">None.</p></div>`}
        </div>
      </details>
    </section>`);
    root.appendChild(panel);
  })();

  /* ---------- FOOTER ---------- */
  (function footer(){
    const sv = cdiMeta.standards_versions || {};
    const f = el(`<footer>
      <div>CDI engine · ${esc(cdiMeta.specialty?titleCase(cdiMeta.specialty):"")} ${has(cdiMeta.mode)?"· "+esc(cdiMeta.mode)+" mode":""}</div>
      <div class="mono">AHIMA/ACDIS ${esc(sv.ahima_acdis||"—")} · ${esc(sv.specialty_pack||"")} · E/M ${esc((em.meta&&em.meta.standards_version)||"—")}</div>
      <div class="mono faint">Saved case · ${esc(cdiMeta.patient||meta.patient||"")} · rendered offline</div>
    </footer>`);
    root.appendChild(f);
  })();

})(PA_DATA);
</script>
</body>
</html>
